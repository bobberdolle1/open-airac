[workspace]
resolver = "2"
members = [
    "crates/openairac-model",
    "crates/openairac-magnetic",
    "crates/openairac-store",
    "crates/openairac-ingest",
    "crates/openairac-procedures",
    "crates/openairac-integration",
    "crates/openairac-service",
    "crates/openairac-reconcile",
    "crates/openairac-bundle",
    "crates/openairac-routing",
    "crates/openairac-export-xplane",
    "crates/openairac-export",
    "crates/openairac-export-msfs",
    "crates/openairac-export-lnm",
    "crates/openairac-charts",
    "crates/openairac-weather",
    "crates/openairac-export-pmdg",
    "crates/openairac-cli",
    "crates/openairac-plugin",
    "tools/xplane-reference-audit",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["bobberdolle1 <kirill@antigravity.dev>"]
license = "MIT"
repository = "https://github.com/bobberdolle1/open-airac"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
geo = "0.29"
sha2 = "0.10"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
