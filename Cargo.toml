[workspace]
resolver = "2"
members = [
    "crates/openairac-core",
    "crates/openairac-exporter",
    "crates/openairac-planner",
    "crates/openairac-cli",
    "crates/openairac-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["bobberdolle1 <kirill@antigravity.dev>"]
license = "MIT"
repository = "https://github.com/bobberdolle1/open-airac"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
