name: OpenAIRAC Scheduled Data Sync

on:
  schedule:
    # Daily check for updated provider datasets
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-and-sync:
    name: Check Provider Datasets & Validate Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Test OurAirports Data Sync & Export Pipeline
        run: |
          mkdir -p dist/xplane
          cargo run -p openairac-cli -- sync --provider ourairports --db ./data/world.sqlite --fixture
          cargo run -p openairac-cli -- doctor --db ./data/world.sqlite
          cargo run -p openairac-cli -- validate --db ./data/world.sqlite
          cargo run -p openairac-cli -- export xplane --db ./data/world.sqlite --out ./dist/xplane --allow-empty
