name: OpenAIRAC 28-Day Automated Builder

on:
  schedule:
    # Runs at 00:00 UTC every 28 days
    - cron: '0 0 */28 * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --workspace

      - name: Build OpenAIRAC Release Packages
        run: cargo build --release --workspace

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/openairac-cli
